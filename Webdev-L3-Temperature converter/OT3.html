<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="OT3.css">
</head>

<body>

    <div class="container">

        <h1>Temperature Converter</h1>
        <p class="subtitle">Convert temperatures easily</p>

        <div class="form-group">
            <label for="temperature">Enter Temperature</label>
            <input 
                type="number" 
                id="temperature" 
                placeholder="Enter value"
                step="any"
            >
        </div>

        <div class="form-group">
            <label for="unit">Input Unit</label>
            <select id="unit">
                <option value="C">Celsius (°C)</option>
                <option value="F">Fahrenheit (°F)</option>
                <option value="K">Kelvin (K)</option>
            </select>
        </div>

        <button onclick="convertTemperature()">Convert</button>

        <p id="error"></p>

        <div class="result" id="result">
            <h2>Results</h2>

            <div class="result-box">
                <span>Celsius</span>
                <strong id="celsius">--</strong>
            </div>

            <div class="result-box">
                <span>Fahrenheit</span>
                <strong id="fahrenheit">--</strong>
            </div>

            <div class="result-box">
                <span>Kelvin</span>
                <strong id="kelvin">--</strong>
            </div>
        </div>

    </div>

    <script src="OT3.js"></script>
</body>
</html>
